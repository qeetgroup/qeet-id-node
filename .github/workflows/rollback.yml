name: Rollback

# Points `latest` back at an older published version, so `bun add @qeet-id/node` stops serving a bad
# release.
#
# A published version is immutable and cannot be replaced, and unpublishing breaks every lockfile
# that already pins it — so instead of removing the bad version, this moves the `latest` dist-tag
# to a known-good one. Anyone who pinned the bad version explicitly keeps working; everyone
# installing fresh gets the good one.
#
# Run it from Actions → Rollback → Run workflow, and give it the version to go back to.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to make latest (e.g. 0.1.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@qeet-id"

      - id: check
        name: the target version exists and is not already latest
        env:
          TARGET: ${{ inputs.version }}
        run: |
          set -uo pipefail
          name=$(node -p "require('./package.json').name")
          echo "name=$name" >> "$GITHUB_OUTPUT"

          # Reject a version that was never published — otherwise the dist-tag move fails with a
          # less obvious error.
          if ! npm view "$name@$TARGET" version >/dev/null 2>&1; then
            echo "::error::$name@$TARGET is not published. Pick a version that exists: npm view $name versions"
            exit 1
          fi

          current=$(npm view "$name" dist-tags.latest 2>/dev/null || echo "")
          echo "current latest: ${current:-unknown}"
          echo "target:         $TARGET"
          if [ "$current" = "$TARGET" ]; then
            echo "::notice::latest is already $TARGET. Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "previous=${current:-unknown}" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.changed == 'true'
        name: move the latest dist-tag
        env:
          TARGET: ${{ inputs.version }}
          NAME: ${{ steps.check.outputs.name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Dist-tag changes through OIDC need npm 11.21 or newer.
        run: npx -y npm@^11.21.0 dist-tag add "$NAME@$TARGET" latest

      - if: steps.check.outputs.changed == 'true'
        name: summarise
        env:
          PREVIOUS: ${{ steps.check.outputs.previous }}
          TARGET: ${{ inputs.version }}
        run: |
          {
            echo "## Rolled back"
            echo
            echo "\`latest\` moved from \`$PREVIOUS\` to \`$TARGET\`."
            echo
            echo "Fresh installs now resolve to \`$TARGET\`. The bad version is still on the registry"
            echo "and still installable if pinned explicitly, which is deliberate — unpublishing would"
            echo "break existing lockfiles."
          } >> "$GITHUB_STEP_SUMMARY"
