name: Version

# Bumps the patch version of @qeet-id/node on the PR branch, so the version you are releasing is
# visible in the PR diff and reviewable like any other change.
#
# Want a minor or major bump instead? Edit `version` in package.json yourself. This workflow only
# acts when the PR's version still equals the base branch's and that version has already been
# released, so a manual bump, or a first release of the base's version, is left alone.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: version-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    # A fork PR gets a read-only token and cannot be pushed to, and a bot's own commit must not
    # trigger another bump.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      actions: write # start CI on the bumped commit (see the last step)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: bump the patch version unless it is already raised
        id: bump
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          # A PR can be merged before this job runs; its head is then already in the base branch.
          if git merge-base --is-ancestor HEAD "origin/$BASE"; then
            echo "This PR's head is already in $BASE (merged or empty). Nothing to bump."
            exit 0
          fi

          current=$(node -p "require('./package.json').version")
          if ! base_package=$(git show "origin/$BASE:package.json" 2>/dev/null); then
            echo "$BASE has no package.json yet — first release of $current. Leaving it alone."
            exit 0
          fi
          base=$(printf '%s' "$base_package" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          echo "PR version: $current"
          echo "$BASE version: $base"

          if [ "$current" != "$base" ]; then
            echo "Version already raised in this PR. Leaving it alone."
            exit 0
          fi
          # The base's version was never released (no tag, never on npm): merging releases it as is.
          if ! git rev-parse -q --verify "refs/tags/v$base" >/dev/null && node scripts/npm-versions.mjs unused "$base"; then
            echo "$base has not been released yet. Leaving it alone."
            exit 0
          fi

          # The next patch npm has never accepted: a version that was published and later
          # unpublished can never be published again, so it is skipped.
          next=$(node scripts/npm-versions.mjs next "$base")
          echo "Bumping $current -> $next"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$next';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to $next"
          git push origin "HEAD:$HEAD_REF"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      # GitHub holds pull_request runs on a commit pushed by this workflow ("action required"). A run
      # started explicitly is not held, so start CI on the bumped commit.
      - name: run CI on the bumped commit
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref "$HEAD_REF" --repo "$REPO"
