# qeet-id-node — repository context metadata (Level 2).
# Inherits qeetgroup/qeet-context (L0) and qeetgroup/qeet-id-context (L1).

schema_version: 1

context: {type: repository, level: L2, canonical: true, last_verified: "2026-08-28"}

inheritance:
  organization: {repository: qeetgroup/qeet-context, level: L0}
  product:      {repository: qeetgroup/qeet-id-context, level: L1}

repository:
  name: qeet-id-node
  product: qeet-id
  type: sdk
  role: sdk
  status: development        # v0.1.0 — NOT PUBLISHED: npm returns 404
  visibility: public
  default_branch: main

runtime:
  language: TypeScript
  node: ">=18.17"            # .nvmrc pins 24
  package_manager: pnpm@10.32.1
  runtime_deps: none         # zero runtime dependencies; devDeps only
  build: tsup                # dual ESM/CJS, dts, target node18

module: {name: "@qeet-id/node", version: "0.1.0"}

architecture:
  style: category-folders           # ADR-0001
  client_shape: flat-fields         # ADR-0002 — client.users, client.apiKeys, ...
  error_style: throw                # ADR-0003 — never a (result, error) tuple
  wire_casing: snake_case-preserved # ADR-0004
  categories: [identity, authentication, authorization, administration]
  shared: [src/transport, src/utils, src/errors, src/types]

contracts:
  consumes: {api: qeet-id-server, base_url: https://api.id.qeet.in}
  auth_scheme: "authorization: ApiKey <qk_...>"   # lowercase header key
  oauth_form_auth: "Basic <base64>"

defaults:
  timeout_ms: 10000
  max_retries: 2
  jwks_cache_ttl_ms: 300000
  jwks_refresh_cooldown_ms: 60000
  clock_skew_seconds: 30
  retry_policy: 429 always; 5xx only when idempotent (GET/DELETE)

commands:
  install: pnpm install
  check:   pnpm check        # typecheck + lint + test — the gate
  build:   pnpm build
  test:    pnpm test

ci:
  workflows: [ci.yml, codeql.yml, lint.yml, release.yml, security.yml]
  matrix: ["18.17", "20", "22", "24"]
  note: ci.yml does NOT run lint — lint lives only in lint.yml
  release: push main -> bump package.json -> gate -> pnpm publish --access public --provenance -> tag vX.Y.Z

security:
  sensitive_paths:
    - src/utils/jwt.ts        # JWKS + ES256
    - src/utils/webhook.ts    # HMAC verification
    - src/transport/          # auth header injection
  never: [add a runtime dependency, log an API key, weaken retry idempotency]

llm_context:
  primary_instructions: AGENTS.md
  canonical: docs/llm/context.md
  boundaries: docs/llm/boundaries.md
  workflows: docs/llm/workflows.md
  architecture_map: docs/llm/architecture-map.md
  adapters: [CLAUDE.md, GEMINI.md, .github/copilot-instructions.md]
